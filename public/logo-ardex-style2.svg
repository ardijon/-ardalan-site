<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="220" height="60" fill="transparent"/>

  <!-- Icon - Geometric A -->
  <g transform="translate(10, 8)">
    <!-- Triangle shape -->
    <polygon points="25,2 48,42 2,42"
             fill="none"
             stroke="#1E293B"
             stroke-width="2.5"
             stroke-linejoin="round"/>

    <!-- Horizontal line -->
    <line x1="12" y1="28" x2="38" y2="28"
          stroke="#D97706"
          stroke-width="2.5"
          stroke-linecap="round"/>

    <!-- Dot -->
    <circle cx="25" cy="20" r="3" fill="#D97706"/>
  </g>

  <!-- Text -->
  <text x="68" y="38"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="32"
        font-weight="600"
        fill="#1E293B"
        letter-spacing="3">ARDEX</text>

  <!-- Tagline -->
  <text x="68" y="52"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="8"
        fill="#94A3B8"
        letter-spacing="2">TECHNOLOGY & INNOVATION</text>
</svg>
