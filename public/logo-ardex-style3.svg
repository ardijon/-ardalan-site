<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="60" fill="transparent"/>

  <!-- Icon - Abstract AI symbol -->
  <g transform="translate(12, 10)">
    <!-- Circle -->
    <circle cx="20" cy="20" r="18"
            fill="none"
            stroke="#0D9488"
            stroke-width="2"/>

    <!-- A shape inside -->
    <path d="M 10 30 L 20 10 L 30 30"
          fill="none"
          stroke="#0D9488"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- AI dot -->
    <circle cx="20" cy="24" r="2.5" fill="#D97706"/>

    <!-- Tech accent -->
    <path d="M 32 15 L 38 15 M 32 20 L 36 20 M 32 25 L 38 25"
          stroke="#94A3B8"
          stroke-width="1.5"
          stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="65" y="35"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="34"
        font-weight="700"
        fill="#0D9488"
        letter-spacing="2">ARDEX</text>

  <!-- Accent line -->
  <line x1="65" y1="42" x2="145" y2="42"
        stroke="#D97706"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Subtitle -->
  <text x="65" y="54"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="9"
        fill="#64748B"
        letter-spacing="1.5">AI · SOFTWARE · CONSULTING</text>
</svg>
